[project]
name = "docuflow-engine"
version = "0.1.0"
description = "DocuFlow local PDF engine — in-place text replacement, encryption and Word⇄PDF conversion via PyMuPDF."
requires-python = ">=3.10"
dependencies = [
    "pymupdf>=1.24,<2",
    "flask>=3.0,<4",
    "pdf2docx>=0.5,<0.6",
    "python-docx>=1.1,<2",
    "reportlab>=4,<5",
    "openpyxl>=3.1,<4",
    "python-pptx>=0.6,<2",
    "Pillow>=10,<12",
    "mammoth>=1.8,<2",
    "olefile>=0.46",
]
